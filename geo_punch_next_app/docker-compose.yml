services:
  app:
    image: musfiquerrhman/geopunch:latest

    build:
      context: .
      dockerfile: Dockerfile
    container_name: GEOPUNCH_SERVER
    restart: always
    ports:
      - "10000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=Asia/Dhaka
      - MAP_TILE_UPSTREAM_URL=http://geopunch-maps/tile
    volumes:
      - attendance_uploads:/app/data/attendance-uploads
    networks:
      - default
      - maps

volumes:
  attendance_uploads:

networks:
  maps:
    external: true
    name: geopunch_maps
